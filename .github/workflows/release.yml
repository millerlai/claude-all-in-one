name: cut-release
run-name: Release ${{ inputs.version || 'next version' }}${{ inputs.head && format(' at {0}', inputs.head) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z, without v). Empty uses the suggested bump
        required: false
        type: string
      head:
        description: Fallback only - full SHA of a chore(release) commit you built locally; skips the Copilot draft
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# One release at a time, including both approval waits. Never cancel a run
# automatically after it might have pushed an immutable tag.
concurrency:
  group: cut-release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  # Drafts the CHANGELOG section with Copilot CLI and builds the candidate.
  # The model runs before any write token exists; release_notes.py locks its
  # tools and checks the session for the tools it was actually offered.
  notes:
    if: github.ref == 'refs/heads/main' && inputs.head == ''
    environment: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      head: ${{ steps.candidate.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the platform floors prepare checks, and Copilot CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.283 @openai/codex@0.157.1 @github/copilot@1.0.91
      - name: Configure the release commit identity
        run: |
          git config user.name 'release automation'
          git config user.email 'release@users.noreply.github.com'
      - name: Draft the release notes and commit the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: "false"
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_actions.py notes "$RELEASE_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record the candidate
        id: candidate
        shell: bash
        run: |
          echo "version=$(python -c 'import json; print(json.load(open("plugins/cai/.claude-plugin/plugin.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/release/v$RELEASE_VERSION"

  check:
    needs: notes
    # Runs after notes, or alone when a locally built head was given.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.notes.result == 'success' || (needs.notes.result == 'skipped' && inputs.head != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.notes.outputs.version || inputs.version }}
      RELEASE_HEAD: ${{ needs.notes.outputs.head || inputs.head }}
    outputs:
      version: ${{ needs.notes.outputs.version || inputs.version }}
      head: ${{ needs.notes.outputs.head || inputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check candidate and main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_actions.py check "$RELEASE_VERSION" "$RELEASE_HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  cut:
    needs: check
    # A skipped notes job would otherwise skip everything downstream.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    environment: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      RELEASE_HEAD: ${{ needs.check.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Install the platform floors used by release.py
        run: npm install --global @anthropic-ai/claude-code@2.1.283 @openai/codex@0.157.1
      - name: Validate and test before obtaining write credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_actions.py gate "$RELEASE_VERSION" "$RELEASE_HEAD"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure Git authentication and tag identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name 'release automation'
          git config user.email 'release@users.noreply.github.com'
      - name: Push tag, verify both installs, and open release PR
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/release_actions.py cut "$RELEASE_VERSION" "$RELEASE_HEAD"

      # Mint again after installs: installation tokens expire after one hour.
      - uses: actions/create-github-app-token@v2
        id: publish-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read
      - name: Wait for release CI and publish
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: python scripts/release_actions.py publish "$RELEASE_VERSION" "$RELEASE_HEAD"

  merge:
    needs: [check, cut]
    if: ${{ !cancelled() && needs.cut.result == 'success' }}
    environment: release-merge
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      RELEASE_HEAD: ${{ needs.check.outputs.head }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
      - name: Merge the approved head and verify main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/release_actions.py merge "$RELEASE_VERSION" "$RELEASE_HEAD"
