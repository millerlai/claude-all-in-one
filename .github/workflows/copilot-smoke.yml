name: copilot-smoke
run-name: Copilot CLI smoke test at ${{ github.sha }}

# Throwaway experiment for the release-notes design: can a personal-account
# repo run Copilot CLI with a fine-grained PAT, pick a model, return parseable
# output, and run with every tool unavailable? Delete once answered.
on:
  push:
    branches: [spike/copilot-cli-smoke]
    paths: [.github/workflows/copilot-smoke.yml]

permissions:
  contents: read

concurrency:
  group: copilot-smoke
  cancel-in-progress: true

jobs:
  smoke:
    environment: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COPILOT_AUTO_UPDATE: "false"
      # Round 1 showed the default is claude-sonnet-5 and the doc's example
      # names are rejected; pin what was actually served.
      MODEL: claude-sonnet-5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @github/copilot@1.0.91

      - name: Probe Copilot CLI
        shell: bash
        # Only this step sees the PAT, not checkout or npm install scripts.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          summary="$GITHUB_STEP_SUMMARY"
          failed=0

          # Runs one probe, never stops the script, and records exit code and
          # output in the summary and the log, so a failed probe is still an
          # answer and the result is readable with gh run view --log.
          probe() {
            local name="$1"; shift
            local out rc
            out="$("$@" 2>&1)"; rc=$?
            printf '%s\n' "$out" > "/tmp/probe-${name// /_}.txt"
            {
              echo "### $name"
              echo "exit: $rc"
              echo '```text'
              printf '%s\n' "$out" | head -n 60
              echo '```'
            } | tee -a "$summary"
            return $rc
          }
          note() { echo "RESULT $*" | tee -a "$summary"; }

          # Round 1's P4 measured path verification, not tool lockdown: /etc
          # is outside the working directory, and P5b showed bash running
          # 'cat -' with no tool flags at all. Test inside the workspace, with
          # a control run that must be able to read the canary.
          canary="canary-$RANDOM$RANDOM$RANDOM"
          echo "$canary" > canary.txt
          ask="Read the file canary.txt in the current directory with any tool you have and reply with its exact content. If you have no way to read files, reply exactly NO_TOOLS."
          lock=(--available-tools= --disable-builtin-mcps)

          # P6a control: default tools must read the canary, or the test is blind.
          probe "P6a control default tools" copilot -p "$ask" -s --no-ask-user --model "$MODEL"
          if grep -qF "$canary" /tmp/probe-P6a_control_default_tools.txt; then
            note "P6a control read the canary: yes (test can detect a tool)"
          else
            note "P6a control read the canary: no (test is blind, P6b proves nothing)"
            failed=1
          fi

          # P6b lockdown: the same request must not reach the canary.
          probe "P6b lockdown" copilot -p "$ask" -s --no-ask-user --model "$MODEL" "${lock[@]}"
          if grep -qF "$canary" /tmp/probe-P6b_lockdown.txt; then
            note "P6b lockdown read the canary: LEAKED"
            failed=1
          else
            note "P6b lockdown read the canary: no"
          fi

          # P6c: what the session itself reports as offered tools.
          probe "P6c lockdown json" copilot -p "Reply with exactly the word OK and nothing else." --no-ask-user --model "$MODEL" --output-format=json "${lock[@]}"
          note "P6c tool_count reported: $(jq -r 'select(.type=="session.usage_checkpoint") | .data.promptCacheBreakState[]?.models[]?.tool_count' /tmp/probe-P6c_lockdown_json.txt 2>/dev/null | sort -u | tr '\n' ' ')"
          note "P6c tool names reported: $(jq -r 'select(.type=="session.usage_checkpoint") | .data.promptCacheBreakState[]?.models[]?.tools[]?.name' /tmp/probe-P6c_lockdown_json.txt 2>/dev/null | sort -u | tr '\n' ' ')"
          note "P6c MCP servers loaded: $(jq -r 'select(.type=="session.mcp_servers_loaded") | .data.servers[]?.name' /tmp/probe-P6c_lockdown_json.txt 2>/dev/null | tr '\n' ' ')"

          # P7: release-sized prompt through argv, locked down, with stats, to
          # see the credit cost once the tool schemas are gone.
          {
            echo "Count the lines in the document below that start with '## v'. Reply with the number only."
            echo "----- document -----"
            cat CHANGELOG.md
            git log --format='%s%n%b' -40
          } > /tmp/big-prompt.txt
          note "P7 prompt bytes: $(wc -c < /tmp/big-prompt.txt), expected answer: $(grep -c '^## v' CHANGELOG.md)"
          probe "P7 release-sized locked down" copilot -p "$(cat /tmp/big-prompt.txt)" --no-ask-user --model "$MODEL" "${lock[@]}"

          # P8: same small prompt as round 1's P1, locked down, to compare credits.
          probe "P8 small locked down" copilot -p "Reply with exactly the word OK and nothing else." --no-ask-user --model "$MODEL" "${lock[@]}"

          exit $failed
