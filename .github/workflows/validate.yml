name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab; tick `windows` to add the Windows job.
  workflow_dispatch:
    inputs:
      windows:
        description: Also run on windows-latest
        type: boolean
        default: false
# A newer push to a pull request makes its older run moot. Pushes to main are
# never cancelled: scripts/release_actions.py waits on the run for one exact
# commit, and a cancelled run there would fail the release.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      # One platform failing says nothing about the other; let both report.
      fail-fast: false
      matrix:
        # Linux on every PR and push. Windows (~10 min) only on a manual run
        # with `windows` ticked; `inputs` is empty on other events, so the
        # expression falls through to Linux alone.
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compares against origin/<base>, which needs the merge
          # base; a shallow clone has neither.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pytest-xdist pytest-cov "coverage>=7.10" diff-cover
      - run: python scripts/validate.py
      # Coverage roughly doubles the suite's time, and one platform's
      # measurement is enough to gate on, so Windows runs the plain suite.
      - name: pytest
        if: runner.os == 'Windows'
        run: python -m pytest -n auto
      - name: pytest (with coverage)
        if: runner.os == 'Linux'
        run: python -m pytest -n auto --cov --cov-report=term:skip-covered --cov-report=xml
      # 90% on the lines this pull request changes, not on the whole tree:
      # older code below the bar does not turn an unrelated PR red. `**`, not
      # `*`, because a single star does not cross a directory separator.
      - name: Coverage (changed lines)
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: >
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --include 'plugins/cai/scripts/**' 'scripts/**'
          --fail-under=90
